- target: "girl" # what word for erasing the positive concept from
  positive: "masterpiece, Best Quality, Intricate Details, extremely detailed gradient eyes,extremely detailed hair, extremely detailed hair face and skin, perfect anatomy, thick highlights in eyes,extremely detailed glistening iris, perfect shading, perfect overlay, perfect highlights, color tress, colorful reflected light in eyes,glitter eyes,beautiful and aesthetic, shiny,sparkling eyes" # concept to erase
